  <circle cx="50" cy="50" r="46" fill="#1B4332" />
  
  <!-- Subtle inner gradient ring in sunlight gold -->
  <circle cx="50" cy="50" r="43" stroke="#E9C46A" stroke-width="1.5" stroke-opacity="0.3" fill="none" />
  
  <!-- Stylized leaf silhouette -->
  <path d="M50 20 C68 20 80 36 80 54 C80 68 68 78 50 82 C32 78 20 68 20 54 C20 36 32 20 50 20 Z" fill="#2D5A44" />
  
  <!-- Half leaf highlight in sage -->
  <path d="M50 20 C68 20 80 36 80 54 C80 68 68 78 50 82 C50 62 50 40 50 20 Z" fill="#739E82" opacity="0.9" />
  
  <!-- Winding nature trail vein cutting through the center in sunlight gold -->
  <path d="M50 24 C52 35 44 45 52 56 C58 64 48 72 50 80" stroke="#E9C46A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Side veins / trail waypoints -->
  <path d="M51 38 C58 35 64 36 67 39" stroke="#E9C46A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M49 48 C42 46 36 49 33 53" stroke="#FAF8F5" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <path d="M52 61 C60 59 66 63 68 67" stroke="#E9C46A" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  
  <!-- Compass / trail star highlight at the peak -->
  <circle cx="50" cy="24" r="2.5" fill="#FAF8F5" />
</svg>
